services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: university_cms
      POSTGRES_USER: cms
      POSTGRES_PASSWORD: cms_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cms -d university_cms"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://cms:cms_password@postgres:5432/university_cms?schema=public
      AUTH_SECRET: replace-with-a-long-random-production-secret
      JWT_SECRET: replace-with-a-long-random-production-secret
      REDIS_URL: redis://redis:6379
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
